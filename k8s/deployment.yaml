apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureapp
  template:
    metadata:
      labels:
        app: secureapp
    spec:
      containers:
      - name: secureapp
        image: europe-west1-docker.pkg.dev/able-cogency-250511/app-images/secureapp:v1
        ports:
        - containerPort: 8000
