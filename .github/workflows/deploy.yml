
name: CI/CD - SecureApp (Commit → Test & Scan → Build → Store → Deploy → Monitor)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test_scan:
    name: Test & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest bandit pip-audit

      # ---- Tests (CI) ----
      - name: Run unit tests
        run: |
          pytest -q

      # ---- SAST (Bandit) ----
      # Minimal Bandit example comes from Bandit docs. [3](https://bandit.readthedocs.io/en/latest/ci-cd/github-actions.html)
      - name: Bandit (SAST)
        run: |
          bandit -r . -x ./.venv,./tests,./google-cloud-sdk -ll -iii

      # ---- Dependency vulnerability scan ----
      - name: pip-audit (dependencies)
        run: |
          pip-audit || true

      # ---- IaC scan (Terraform) ----
      # If you have Terraform in ./terraform, scan it with Trivy in fs mode. [4](https://github.com/aquasecurity/trivy-action)
      - name: Trivy IaC scan (Terraform/K8s manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  build_store:
    name: Build Container & Store Artefact
    runs-on: ubuntu-latest
    needs: [ test_scan ]
    permissions:
      contents: read
      id-token: write

    env:
      REGION: europe-west1
      IMAGE_NAME: secureapp
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REPO: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-images/secureapp

      # opt-in early to Node24 behaviour to avoid the Node20 deprecation warning you saw
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image (SHA tag)
        run: |
          docker build -t $IMAGE_REPO:$IMAGE_TAG .

      - name: Set up Python and install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: pytest

      # Example: run container and do a basic health check before pushing (optional but strong)
      - name: Container health check
        run: |
          CONTAINER_ID=$(docker run -p 8080:8080 -e PORT=8080 "$IMAGE_REPO:$IMAGE_TAG")
          sleep 5
          # wait for container to start
          if ! docker logs $CONTAINER_ID 2>&1 | grep -q "Listening on port"; then
            echo "Container failed health check"
            docker logs $CONTAINER_ID
            exit 1
          fi
          docker stop $CONTAINER_ID

      # ---- Container vulnerability scan BEFORE push (optional but strong) ----
      # Trivy image scan example is from Trivy action docs. [4](https://github.com/aquasecurity/trivy-action)
      - name: Trivy image scan (pre-push)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image (store artefact)
        run: |
          docker push $IMAGE_REPO:$IMAGE_TAG

      # Optional: store build metadata as a pipeline artefact (audit trail)
      - name: Write build metadata
        run: |
          echo "image=$IMAGE_REPO:$IMAGE_TAG" > build-metadata.txt
          echo "commit=${{ github.sha }}" >> build-metadata.txt

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build-metadata.txt

  deploy:
    name: Deploy (Terraform Apply)
    runs-on: ubuntu-latest
    needs: [ build_store ]
    permissions:
      contents: read
      id-token: write

    env:
      REGION: europe-west1
      ZONE: europe-west1-b
      CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REPO: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-images/secureapp

      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud (incl. GKE auth plugin)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # Needed so Terraform's kubernetes provider can talk to the cluster (no kubectl apply).
      - name: Configure kubecontext for Terraform
        run: |
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --zone "$ZONE" \
            --project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt & validate
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init
          terraform validate

      # On PRs, run plan only (good governance pattern). [1](https://lloydsbanking.sharepoint.com/sites/FP/SitePages/GCP-2.0-Resources.aspx?web=1)
      - name: Terraform plan (PR)
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_repo=$IMAGE_REPO" \
            -var="image_tag=$IMAGE_TAG"

      # On main, apply (CD)
      - name: Terraform apply (main)
        if: github.event_name == 'push'
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_repo=$IMAGE_REPO" \
            -var="image_tag=$IMAGE_TAG"

  monitor:
    name: Monitor (Rollout + Health Check)
    runs-on: ubuntu-latest
    needs: [ deploy ]
    permissions:
      contents: read
      id-token: write

    env:
      ZONE: europe-west1-b
      CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
      NAMESPACE: default
      DEPLOYMENT_NAME: secureapp
      SERVICE_URL: ${{ secrets.SERVICE_URL }}

      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud (incl. GKE auth plugin)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get cluster credentials (read-only monitoring)
        run: |
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --zone "$ZONE" \
            --project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Rollout status
        run: |
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE --timeout=180s

      - name: Basic health check (HTTP)
        run: |
          curl -fsS "$SERVICE_URL" | head -c 200 || exit 1
